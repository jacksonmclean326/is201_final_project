<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Ultimate Tic Tac Toe</title>
		<style>
		:root{
			--gap:8px;
			--board-size:540px;
			--small-size:calc((var(--board-size) - var(--gap)*2) / 3);
			--cell-size:calc((var(--small-size) - var(--gap)*2) / 3);
			--x-color:#0b79d0;
			--o-color:#d04b0b;
		}
		*{box-sizing:border-box}
		body{font-family:system-ui,Segoe UI,Roboto,Arial;color:#222;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:24px;padding-bottom:64px}
		main{max-width:900px;width:100%;padding-bottom:20px}
		h1{margin:0 0 12px}
		.controls{display:flex;gap:12px;align-items:center;margin-bottom:12px}
		#status{font-weight:600}
		.controls button#restart{padding:8px 12px;border-radius:10px;border:0;background:linear-gradient(180deg,#4aa3ff,#0b79d0);color:#fff;font-weight:700;box-shadow:0 6px 14px rgba(11,121,208,0.18);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;outline:none}
		.controls button#restart:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(11,121,208,0.22)}
		.controls button#restart:active{transform:translateY(0) scale(.99)}
		.controls button#restart:focus{box-shadow:0 0 0 4px rgba(11,121,208,0.14)}
		#game{width:var(--board-size);max-width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);background:#111;padding:var(--gap);border-radius:10px;align-items:stretch}
		.small-board{background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:var(--gap);padding:var(--gap);position:relative;border-radius:6px}
		.small-board.active{outline:4px solid rgba(11,121,208,0.14)}
		.small-board.won::after{content:"";position:absolute;inset:0;border-radius:6px;opacity:0.12}
		.small-board.won.x::after{background:linear-gradient(90deg,var(--x-color),#7cc5ff)}
		.small-board.won.o::after{background:linear-gradient(90deg,var(--o-color),#ffc69a)}
		.cell{background:transparent;border:2px solid rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;font-size:clamp(16px,2.5vw,26px);width:100%;aspect-ratio:1/1;cursor:pointer;user-select:none}
		.cell.x{color:var(--x-color);font-weight:700}
		.cell.o{color:var(--o-color);font-weight:700}
		.cell.disabled{cursor:not-allowed;opacity:0.45}
		.overlay-winner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:rgba(255,255,255,0.95)}
		.small-board .overlay-winner{font-size:34px}
		footer{margin-top:12px;color:#444}

		@media(max-width:800px){
			:root{--board-size:360px}
			.cell{font-size:20px}
		}
		</style>
</head>
<body>
	<main>
		<h1>Ultimate Tic Tac Toe</h1>
		<section class="controls">
			<button id="restart">Restart</button>
			<div id="status">Loading...</div>
		</section>

		<div id="game" aria-label="Ultimate Tic Tac Toe board"></div>

		<footer>
			<small>Click a cell to play. You must play in the small board matching the previous move's cell.
			If that board is finished, you may play anywhere.</small>
		</footer>
	</main>

		<script>
		// Ultimate Tic Tac Toe implementation (inlined)
		(function(){
			const WIN_LINES = [
				[0,1,2],[3,4,5],[6,7,8],
				[0,3,6],[1,4,7],[2,5,8],
				[0,4,8],[2,4,6]
			];

			const gameEl = document.getElementById('game');
			const statusEl = document.getElementById('status');
			const restartBtn = document.getElementById('restart');

			let boards; // array of 9 boards, each board is array of 9 cells: 0 empty, 1 X, -1 O
			let boardWinners; // 0 none, 1 X, -1 O, 2 draw
			let currentPlayer; // 1 X, -1 O
			let nextBoardIndex; // null means free move, otherwise 0..8
			let mainWinner = 0;

			function init(){
				boards = Array.from({length:9},()=>Array(9).fill(0));
				boardWinners = Array(9).fill(0);
				currentPlayer = 1; // X starts
				nextBoardIndex = null;
				mainWinner = 0;
				renderBoard();
				updateStatus();
			}

			function renderBoard(){
				gameEl.innerHTML = '';
				for(let bi=0;bi<9;bi++){
					const sb = document.createElement('div');
					sb.className = 'small-board';
					sb.dataset.index = bi;
					if(boardWinners[bi] !== 0){
						sb.classList.add('won');
						sb.classList.add(boardWinners[bi]===1? 'x':'o');
						const ov = document.createElement('div');
						ov.className = 'overlay-winner';
						ov.textContent = boardWinners[bi]===1? 'X': (boardWinners[bi]===-1? 'O': '•');
						sb.appendChild(ov);
					}
					const isActive = (nextBoardIndex === null && boardWinners[bi]===0) || nextBoardIndex===bi;
					if(isActive && mainWinner===0) sb.classList.add('active');

					for(let ci=0;ci<9;ci++){
						const cell = document.createElement('div');
						cell.className = 'cell';
						cell.dataset.bi = bi;
						cell.dataset.ci = ci;
						const val = boards[bi][ci];
						if(val===1) cell.classList.add('x');
						if(val===-1) cell.classList.add('o');
						if(val!==0) cell.textContent = val===1? 'X':'O';
						if(boardWinners[bi]!==0 || mainWinner!==0) cell.classList.add('disabled');
						// If move must be in a specific board and this board isn't it, disable
						if(nextBoardIndex!==null && nextBoardIndex!==bi) cell.classList.add('disabled');
						cell.addEventListener('click', onCellClick);
						sb.appendChild(cell);
					}
					gameEl.appendChild(sb);
				}
			}

			function onCellClick(e){
				const el = e.currentTarget;
				const bi = Number(el.dataset.bi);
				const ci = Number(el.dataset.ci);
				if(mainWinner!==0) return;
				if(nextBoardIndex!==null && nextBoardIndex!==bi) return;
				if(boardWinners[bi]!==0) return;
				if(boards[bi][ci]!==0) return;

				boards[bi][ci] = currentPlayer;

				// check small board win
				const winner = checkWinner(boards[bi]);
				if(winner!==0){
					boardWinners[bi] = winner;
				} else if(boards[bi].every(v=>v!==0)){
					boardWinners[bi] = 2; // draw
				}

				// set next required board to the cell index
				if(boardWinners[ci]===0){
					nextBoardIndex = ci;
				} else {
					nextBoardIndex = null; // free move if destination board finished
				}

				// check main board win: build main array representing wins for each small board
				const mainArray = boardWinners.map(bw=> bw===1?1:(bw===-1?-1:0));
				const mainWin = checkWinner(mainArray);
				if(mainWin!==0){
					mainWinner = mainWin;
				} else if(boardWinners.every(bw=>bw!==0)){
					mainWinner = 2; // global draw
				}

				// switch player
				currentPlayer = -currentPlayer;
				renderBoard();
				updateStatus();
			}

			function checkWinner(arr){
				for(const line of WIN_LINES){
					const [a,b,c] = line;
					if(arr[a]!==0 && arr[a]===arr[b] && arr[a]===arr[c]) return arr[a];
				}
				return 0;
			}

			function updateStatus(){
				if(mainWinner===1) return statusEl.textContent = 'Player X wins the game!';
				if(mainWinner===-1) return statusEl.textContent = 'Player O wins the game!';
				if(mainWinner===2) return statusEl.textContent = 'The game is a draw.';
				const player = currentPlayer===1? 'X':'O';
				if(nextBoardIndex===null){
					statusEl.textContent = `Player ${player} — play anywhere.`;
				} else {
					// show 1-based index for clarity
					const r = Math.floor(nextBoardIndex/3)+1;
					const c = (nextBoardIndex%3)+1;
					statusEl.textContent = `Player ${player} — must play in small board at row ${r}, col ${c}.`;
				}
			}

			restartBtn.addEventListener('click', ()=>{
				init();
			});

			// initialize
			document.addEventListener('DOMContentLoaded', init);

		})();
		</script>
</body>
</html>
