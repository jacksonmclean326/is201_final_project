<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ultimate Tic Tac Toe</title>
    <link rel="stylesheet" href="AI-page.css" />
  </head>
  <body>
    <main>
      <h1>Ultimate Tic Tac Toe</h1>
      <section class="controls">
        <button id="restart">Restart</button>
        <div id="status">Loading...</div>
      </section>

      <div id="game" aria-label="Ultimate Tic Tac Toe board"></div>

      <footer>
        <small
          >Click a cell to play. You must play in the small board matching the
          previous move's cell. If that board is finished, you may play
          anywhere.</small
        >
      </footer>
    </main>

    <script src="AI-page.js"></script>
  </body>
</html>
